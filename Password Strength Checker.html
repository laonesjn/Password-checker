<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Password Strength Checker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Password Strength Checker</h1>
    <p class="subtitle">Everything runs locally in your browser. Nothing is sent anywhere.</p>

    <label for="password" class="sr-only">Password</label>
    <div class="input-wrap">
      <input type="password" id="password" placeholder="Enter a password" autocomplete="new-password" spellcheck="false">
      <button type="button" class="toggle" id="toggle" aria-label="Show password" aria-pressed="false"></button>
    </div>

    <div class="meter">
      <div class="segments" id="segments" aria-hidden="true"></div>
      <p class="strength-label" id="strength-label" aria-live="polite"></p>
    </div>

    <ul class="rules" id="rules"></ul>

    <button type="button" class="generate" id="generate">Generate Strong Password</button>
    <p class="hint" id="hint" aria-live="polite"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
